server {
    listen 80;
    server_name localhost;

    # Raíz del proyecto (apunta al directorio "public" de Symfony)
    root /var/www/html/public;

    # Archivos de índice
    index index.php index.html index.htm;

    # Configuración para redirigir solicitudes a index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Configuración para manejar solicitudes PHP
    location ~ ^/index\.php(/|$) {
        fastcgi_pass 127.0.0.1:9000;  # PHP-FPM está escuchando en este puerto
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Evita que se acceda directamente a otros archivos PHP
    location ~ \.php$ {
        return 404;
    }

    # Logs de errores y acceso
    error_log /var/log/nginx/project_error.log;
    access_log /var/log/nginx/project_access.log;
}