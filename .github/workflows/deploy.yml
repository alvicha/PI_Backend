name: Deploy Symfony API to AWS EC2

on:
  push:
    branches:
      - alberto

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Clonar el repositorio
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      # Paso 2: Iniciar sesión en Docker Hub
      - name: Iniciar sesión en Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Paso 3: Construir y etiquetar la imagen Docker
      - name: Construir y etiquetar la imagen Docker
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/symfony-api:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/symfony-api:latest ${{ secrets.DOCKER_USERNAME }}/symfony-api:${{ github.sha }}

      # Paso 4: Subir la imagen a Docker Hub
      - name: Subir la imagen a Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/symfony-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/symfony-api:${{ github.sha }}

      # Paso 5: Copiar el archivo docker-compose.yml a EC2
      - name: Copiar docker-compose.yml a EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.REMOTE_KEY }}
          script: |
            # Copiar el archivo docker-compose.yml al servidor EC2
            scp -i ${{ secrets.REMOTE_KEY }} docker-compose.yml ubuntu@${{ secrets.REMOTE_HOST }}:/home/ubuntu/

      # Paso 6: Desplegar en EC2 usando Docker Compose
      - name: Desplegar con Docker Compose en EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ubuntu
          key: ${{ secrets.REMOTE_KEY }}
          script: |
            # Asegurarse de que el contenedor anterior esté detenido
            docker-compose down

            # Levantar los contenedores con docker-compose
            docker-compose -f /home/ubuntu/docker-compose.yml up --build -d
