name: Deploy Symfony App to AWS

on:
  push:
    branches:
      - main  # Cambia esto por la rama que quieres que dispare el despliegue

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Clonar el repositorio
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Iniciar sesión en DockerHub
    - name: Log in to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Construir y subir la imagen de Symfony (PHP)
    - name: Build and push Symfony Docker image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/symfony_app:v1 .
        docker push ${{ secrets.DOCKER_USERNAME }}/symfony_app:v1

    # 4. Transferir docker-compose.yml al servidor remoto
    - name: Transfer docker-compose.yml to remote server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.REMOTE_KEY }}
        source: ./docker-compose.yml
        target: ~/deploy/

    # 5. Desplegar con Docker Compose en el servidor remoto
    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.REMOTE_HOST }}  # Dirección IP o dominio de tu servidor EC2 en AWS
        username: ${{ secrets.REMOTE_USER }}  # Nombre de usuario SSH en tu servidor
        key: ${{ secrets.REMOTE_KEY }}  # Clave privada SSH
        script: |
          # Navegar al directorio donde se encuentra docker-compose.yml
          cd ~/deploy
          
          # Configurar permisos para el socket de Docker
          sudo chmod 666 /var/run/docker.sock
          
          # Detener y eliminar contenedores actuales (si existen)
          docker-compose down || true
          
          # Descargar las últimas imágenes y reiniciar los contenedores
          docker-compose pull
          docker-compose up -d
