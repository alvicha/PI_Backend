name: Deploy Symfony Application to Remote Server

on:
  push:
    branches:
      - alberto

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Clonar el repositorio
      - name: Checkout code
        uses: actions/checkout@v3

      # Iniciar sesión en DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Construir y subir la imagen de la aplicación Symfony
      - name: Build and push Symfony PHP Docker image
        run: |
          cd php
          docker build -t ${{ secrets.DOCKER_USERNAME }}/symfony_pinacoteca:v1 .
          docker push ${{ secrets.DOCKER_USERNAME }}/symfony_pinacoteca:v1

      # Transferir el archivo compose.yml al servidor remoto
      - name: Transfer compose.yml to remote server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          source: ./compose.yml
          target: ~/deploy/

      # Transferir archivo .env (si es necesario para la configuración del servidor)
      - name: Transfer .env file to remote server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          source: ./.env
          target: ~/deploy/

      # Desplegar la aplicación en el servidor remoto usando docker-compose
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          script: |
            cd ~/deploy
            sudo chmod 666 /var/run/docker.sock
            docker compose down || true
            docker compose pull
            docker compose up -d

      # Calentar la caché de Symfony en el servidor remoto
      - name: Warm up Symfony cache on remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.REMOTE_KEY }}
          script: |
            cd ~/deploy
            docker exec -it symfony_container_name php /var/www/html/bin/console cache:warmup --env=prod
